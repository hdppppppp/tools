[workspace]
resolver = "2"
members = [
    "core",
    "jni",
    "node",
    "wasm",
]

# 版本号刻意与客户端 / 服务端发布版本解耦：加密层有独立的协议版本（PROTOCOL_VERSION），
# 它一旦变化就意味着线上要同时升级服务端和客户端，不能跟着 App 的版本号一起漂。
#
# 版本号规则（详见 docs/versioning.md）：`MAJOR.MINOR.PATCH`，铁律是
# **MAJOR == core/src/protocol.rs 的 PROTOCOL_VERSION**。所以协议 v2 → 包 2.x.y。
#   · MAJOR：仅当 PROTOCOL_VERSION 变（线格式破坏，端必须同步升）
#   · MINOR：向后兼容的能力新增
#   · PATCH：修复 / 性能 / 混淆 / 安全，线格式与 API 不变
# tag 必须是 v<此值>；release.yml 的 version-guard 会同时校验
# 「tag == 此 version」和「MAJOR == PROTOCOL_VERSION」，任一不符就拦下。
[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 纯 Rust 实现的密码学组件，没有 C 依赖 —— 这是能同时交叉编译到
# aarch64-linux-android / wasm32-unknown-unknown / x86_64-pc-windows-msvc 的前提。
# 换成 ring 或 openssl 就会卡在 wasm 和 NDK 的链接上。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
getrandom = "0.2"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# 字符串混淆用的编译期加密宏（MIT）。只在开启 `obfuscate` feature 的客户端
# 产物上生效，见 core/src/obf.rs 与 core/Cargo.toml。
cryptify = "3.2"

taotao-crypto-core = { path = "core" }

# ---- release 产物体积与逆向成本 ----
# 四个目标都要吃这套配置：.so/.dll/.node/.wasm 都会被塞进安装包或静态站点，
# 体积直接换算成用户下载量；同时 strip + lto 让提取密钥和还原控制流的成本上升。
#
# 字符串层面的混淆**不在这里**，它由 core 的 `obfuscate` feature 控制 ——
# 客户端的 .so / .dll / .wasm 开，服务端的 .node 不开。见 core/src/obf.rs。
#
# ⚠️ `opt-level` 从 `"z"` 改成 `3` 是**实测驱动的**，不要为了省体积改回去。
#
# 原先是 `opt-level = "z"`（优先体积）。基准测出来它把 X25519 拖慢了 **29 倍**：
# 完整握手 6029 µs vs 207 µs，而 `session.rs` 的注释一直按「约 50 µs」在写
# （207 µs ÷ 4 次标量乘 ≈ 50 µs，说明注释本身就是按满优化写的）。
# 也就是说 release profile 悄悄推翻了代码自己的性能假设，且没有任何报错。
# 数据帧同样受益：seal 1 KB 7.22 µs → 2.51 µs（2.9×），64 KB 385.7 → 117.3 µs。
#
# 代价只有体积：Windows `.dll` 393,216 → 472,576 字节（+20.2%）。
# 四个目标全加起来也就 +200 KB 量级，摊到一个音乐 App 的安装包上是噪声；
# 而 CPU 时间在移动端直接换算成耗电，这笔账明显划算。
#
# 顺带否掉的方案：`[profile.release.package.*]` 只给 curve25519-dalek /
# chacha20 / poly1305 / sha2 开 `opt-level = 3`，其余保持 `"z"`。
# 实测它**握手能拿满**（210 µs）但**数据帧只拿到 1.4×**（seal 1 KB 4.95 µs）——
# 因为帧路径上 chacha20 会被内联进按 `"z"` 编译的调用方，LTO 阶段又被按
# 顶层 opt-level 重新优化回去了。数据帧才是每请求都走的真热路径，
# 所以宁可多花那 20% 体积。
#
# 跑法：`cargo bench -p taotao-crypto-core`（基准直接吃这份 profile，
# 所以量到的就是交付产物的真实性能，不是理想值）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = false
debug = false

# `strip = "symbols"` 而不是 "debuginfo"：动态符号表（.dynsym）里被标记为导出的
# 符号不会被剥掉，否则 cdylib 根本没法被 dlopen / System.loadLibrary 加载 ——
# 也就是说 JNI 的 `Java_com_taotao_music_crypto_NativeCrypto_*` 和 napi 的
# `napi_register_module_v1` 都会安然保留。这里剥掉的是静态符号表，它才是
# 逆向时用来还原函数名和调用关系的那份数据。
strip = "symbols"

# ⚠️ 这里**不能**设 `panic = "abort"`。
#
# 直觉上 abort 能让体积小几十 KB，但 JNI 和 napi 两个绑定层都依赖
# `catch_unwind` 把 Rust panic 转成宿主语言异常。abort 下 panic 直接杀进程，
# catch_unwind 完全失效 —— 一次数组越界就会让整个 App 闪退，且没有任何
# Java/JS 栈信息，线上只能看到「应用崩溃」四个字。
#
# 体积上的代价是 unwind 表（安卓 arm64 上约 40KB），用 `lto = "fat"` 和
# `opt-level = "z"` 已经吃掉了一部分。这点体积换可诊断性，值得。
# （wasm32-unknown-unknown 本身不支持 unwind，Rust 会强制按 abort 编译，
#   但 wasm 侧本来就没有 catch_unwind 的语义，不受这条影响。）
panic = "unwind"

# 调试用的 profile：需要看 Rust 侧栈回溯时用 `--profile dev` 构建。
[profile.dev]
opt-level = 0
debug = true
