[package]
name = "taotao-crypto-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "桃桃音乐传输层加密协议核心：X25519 握手 + ChaCha20-Poly1305 帧加密 + 防重放"

# 依赖一律 default-features = false：core 要被 wasm32-unknown-unknown 消费，
# 任何默认开启的 std 依赖都会在 wasm 目标上编译失败。
[dependencies]
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true
hex.workspace = true

# 编译期字符串混淆。**可选**：客户端产物（.so/.dll/.wasm）由各自的 crate 开启
# `obfuscate` feature，服务端 .node 不开启（它不对外分发，混淆只会白付开销）。
#
# 它是 proc-macro，只在宿主机上跑，不会进目标平台的依赖图 —— 这一点很关键，
# core 要被 wasm32-unknown-unknown 消费，任何带 std 默认特性的普通依赖都会
# 在那边编译失败。
cryptify = { version = "3.2", optional = true }

[features]
# 开启后 core 里的协议标签与错误文案不再以明文出现在二进制里。
# 密钥经 CRYPTIFY_KEY 环境变量注入，缺省用 cryptify 内置的固定密钥 ——
# 两种都保持可复现构建，见 src/obf.rs 的模块文档。
obfuscate = ["dep:cryptify"]

[dev-dependencies]
# 仅测试用：协议向量测试需要固定随机源，避免用例依赖真随机而无法复现。
hex-literal = "0.4"

[build-dependencies]
# build.rs 要解析 TAOTAO_CRYPTO_PSK 的十六进制。
#
# 注意它必须**同时**出现在 [dependencies] 和 [build-dependencies] 里：
# 构建脚本是一个独立编译的 crate，拿不到普通依赖。
# 少了这一行会报 `cannot find module or crate 'hex'`，指向的是 build.rs。
hex = "0.4"

# 性能与分配基准。手写 main 而不是用 criterion：本项目不引入仅测试用的重型依赖，
# 而这里只需要均值，不需要统计显著性。跑法 `cargo bench -p taotao-crypto-core`。
[[bench]]
name = "crypto_bench"
harness = false
